# Labels on the self-evident, in prose. Unverified: `scope: raw` with a line anchor.
extends: existence
message: "Drop the label '%s' and state the content."
level: warning
scope: raw
nonword: true
tokens:
  - '(?m)^\s*(?:[-*]\s+)?\*{0,2}(?:Note|Please note|Important|Tip|Hint|Info|Description|Summary|Overview|Purpose|Details|Explanation)\*{0,2}:'
