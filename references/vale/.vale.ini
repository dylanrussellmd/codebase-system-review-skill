# Optional Vale config for references/writing.md. Untested: no Vale run has checked these rules; try each on a sample.
# Run: vale sync --config <skill folder>/references/vale/.vale.ini   (once, fetches the packages)
#      vale --config <skill folder>/references/vale/.vale.ini --output=JSON --no-exit <paths>
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project
Packages = write-good, Readability, tbhb/vale-ai-tells

[*.{md,mdx,rst,adoc,txt,html}]
BasedOnStyles = Vale, Plain
Vale.Spelling = NO
write-good.Passive = suggestion
write-good.Weasel = warning
Readability.FleschKincaid = suggestion

[*.{py,js,jsx,ts,tsx,go,rs,java,rb,php,cs,swift,kt,c,h,cpp}]
BasedOnStyles = Plain
Plain.ParagraphLength = NO
Plain.Headings = NO
Plain.LabelLead = NO

[ui-strings.md]
BasedOnStyles = Plain, PlainUI
Plain.ParagraphLength = NO
Plain.SentenceLength = NO

[{CHANGELOG,HISTORY,NEWS,UPGRADING,MIGRATING}*]
Plain.History = NO

[**/{adr,adrs,decisions}/**]
Plain.History = NO
