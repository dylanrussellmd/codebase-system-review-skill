# Vale config for references/writing.md, checked with Vale 3.26.0: each rule raises its alert on
# dev/tests/data/tools/vale-samples/. `ledger.py tool-run vale` runs a copy without the Packages line (offline).
# By hand: vale --config <skill folder>/references/vale/.vale.ini --output=JSON --no-exit <paths>
# (`vale sync --config ...` first fetches the Packages, online).
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project
Packages = write-good, Readability, tbhb/vale-ai-tells

[*.{md,mdx,rst,adoc,txt,html}]
BasedOnStyles = Vale, Plain
Vale.Spelling = NO
write-good.Passive = suggestion
write-good.Weasel = warning
Readability.FleschKincaid = suggestion

[*.{py,js,jsx,ts,tsx,go,rs,java,rb,php,cs,swift,kt,c,h,cpp}]
BasedOnStyles = Plain
Plain.ParagraphLength = NO
Plain.Headings = NO
Plain.LabelLead = NO

[ui-strings.md]
BasedOnStyles = Plain, PlainUI
Plain.ParagraphLength = NO
Plain.SentenceLength = NO

[{CHANGELOG,HISTORY,NEWS,UPGRADING,MIGRATING}*]
Plain.History = NO

[**/{adr,adrs,decisions}/**]
Plain.History = NO
