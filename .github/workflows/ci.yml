# Checks every push and pull request: the shipped scripts/ledger.py matches its sources, and the test suite passes.
# Standard library only: nothing is installed. Browser tests skip themselves when Playwright is absent.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scripts/ledger.py is a fresh build of the sources
        run: python3 dev/build.py --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite
        run: python3 -m unittest discover -s dev/tests -t . -v
