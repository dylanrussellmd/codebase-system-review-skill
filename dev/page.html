<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review ledger</title>
<style>
:root{--bg:#f7f8f6;--surface:#fff;--fg:#1b2420;--muted:#5d6b64;--line:#dfe4e0;--field:#828f88;--accent:#0f6b57;--accent-soft:#e2f1ec;--warn:#9a5b00;--warn-soft:#fbefd9;--crit:#a3271f;--crit-soft:#fae6e3;--info:#2b5c99;--info-soft:#e5eefa;
 --display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
:root[data-theme="dark"]{--bg:#121715;--surface:#1a211e;--fg:#e6ece8;--muted:#9aa8a1;--line:#2c3632;--field:#6b7a73;--accent:#5fc9ae;--accent-soft:#17352d;--warn:#e7b25a;--warn-soft:#3a2c12;--crit:#f08d84;--crit-soft:#3d1c19;--info:#8db6ee;--info-soft:#1a2a40;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:var(--top,110px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:0 max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
a{color:var(--accent)}
.skip{position:absolute;left:8px;top:-80px;z-index:10;background:var(--surface);padding:8px 12px;border:1px solid var(--field);border-radius:6px}.skip:focus{top:8px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 0;margin:0 -4px}
.top .row{max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:0 4px}
.brand{font:600 17px var(--display)}
.brand small{color:var(--muted);font:400 13px var(--body);margin-left:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:8px auto 0;padding:0 4px}
.tabs a{text-decoration:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:var(--bg);font:600 12px/20px var(--mono);text-align:center;margin-left:6px}
.theme{all:unset;margin-left:auto;cursor:pointer;color:var(--muted);font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
h1{font:600 26px/1.15 var(--display);margin:18px 0 0;text-wrap:balance}
h1,h2,h3,.lede,.status,.note,.gate .q,.gate .ctx,.refline,.refline code,.opts label,.timeline>div,li{overflow-wrap:anywhere}
h2,h3.title{font:600 19px/1.2 var(--display);margin:8px 0 0;letter-spacing:normal;text-transform:none;color:inherit}
h3,h2.sec{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.lede{color:var(--muted);max-width:72ch;margin:4px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;font-variant-numeric:tabular-nums}
.facts div b{font:600 22px var(--display);display:block}
.facts div span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--fg)}
.field{background:var(--surface);border:1px solid var(--field);border-radius:6px;padding:8px 10px;min-width:0}
.tools input{flex:1 1 240px}
textarea{width:100%;min-height:72px;resize:vertical}
input[type=radio],input[type=checkbox]{accent-color:var(--accent)}
button.btn{cursor:pointer;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-weight:600}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1:focus{outline:none}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:break-word;min-width:4ch}
.grid td{white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
td:first-child{white-space:nowrap}tr.link{cursor:pointer}tr.link:hover td{background:var(--accent-soft)}tr.link a{text-decoration:none}tr.link a:hover,tr.link a:focus-visible{text-decoration:underline}
.scroll{overflow-x:auto}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mono,code{font:500 12.5px var(--mono)}
.muted{color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}.stack.loose{gap:10px}
.card-link{margin:10px 0}
.progress{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.card.grid{padding:0}
.tag{display:inline-block;font:500 11px/1.6 var(--mono);padding:0 7px;border-radius:999px;background:var(--line);color:var(--fg);white-space:nowrap;margin:0 4px 2px 0}
.tag.H,.tag.crit{background:var(--crit-soft);color:var(--crit)}.tag.M,.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.ok{background:var(--accent-soft);color:var(--accent)}.tag.solid{background:var(--accent);color:var(--bg)}.tag.you{background:var(--warn);color:var(--bg)}
details:is(.item,.run){background:var(--surface);border:1px solid var(--line);border-radius:8px}
details:is(.item,.run)>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;gap:10px;padding:10px 12px;align-items:baseline}
details:is(.item,.run)>summary::-webkit-details-marker{display:none}
details:is(.item,.run)>summary .n{font:500 13px var(--mono);color:var(--muted)}
details:is(.item,.run)>summary .n::before{content:"▸ ";content:"▸ " / ""}details:is(.item,.run)[open]>summary .n::before{content:"▾ ";content:"▾ " / ""}
details:is(.item,.run)>summary .t{font-weight:500;overflow-wrap:anywhere}
details:is(.item,.run)>summary .tags{display:flex;flex-wrap:wrap;justify-content:flex-end}
.body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
dl.kv{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px}
dl.kv dt{color:var(--muted);font-size:13px}dl.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.ref{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.refline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:13px}.refline>*{min-width:0}
.code{background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:420px}
.code table{font:12.5px/1.45 var(--mono)}
.code td{border:0;padding:0 10px;white-space:pre;overflow-wrap:normal}
.code td.ln{color:var(--muted);text-align:right;user-select:none;width:1%}
.code tr.hit td{background:var(--warn-soft)}.code tr.hit td.ln{box-shadow:inset 3px 0 var(--warn);color:var(--fg)}
.note{font-size:13px;color:var(--muted)}
.mdtext{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;font-size:14px}
.md{overflow-wrap:anywhere}.md p,.md ul,.md ol{margin:6px 0}
.md h2,.md h3,.md h4{font:600 17px/1.25 var(--display);letter-spacing:normal;text-transform:none;color:inherit;margin:14px 0 4px}.md h2{font-size:19px}.md h4{font-size:15px}
.status{padding:10px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.callout{padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);margin:0}
.callout.you{border-color:var(--warn)}.callout.answer{border-color:var(--accent)}
.status.err{background:var(--crit-soft);color:var(--crit)}
.cols{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
nav.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--top,110px)}
nav.rail button{all:unset;cursor:pointer;display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:7px 10px;border-radius:6px;font-size:14px;align-items:baseline}
nav.rail button:hover{background:var(--accent-soft)}
nav.rail button:focus-visible,.tlist button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail button[aria-current="true"]{background:var(--accent);color:var(--bg)}
nav.rail .i,nav.rail .c{font:500 12px var(--mono);opacity:.8}
nav.rail small{display:block;font-size:12px;opacity:.75}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;max-width:520px}.bar i{display:block;height:100%}
.bar .d{background:var(--accent)}.bar .y{background:var(--warn)}.bar .g{background:var(--info)}
.gate{display:flex;flex-direction:column;gap:10px}
.gate .q{font-weight:500;white-space:pre-wrap}
.gate .ctx{white-space:pre-wrap;color:var(--muted);font-size:14px;max-height:260px;overflow:auto}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:8px 10px;border:1px solid var(--field);border-radius:6px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts small{display:block;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline>div{padding:4px 0 8px 14px;position:relative;font-size:14px}
.timeline>div::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.empty{color:var(--muted);padding:18px 0}
.target{box-shadow:inset 3px 0 var(--accent)}tr.target td{background:var(--accent-soft)}.target:focus{outline:none}
.chart svg{width:100%;height:auto;display:block}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:1px;max-height:70vh;overflow:auto;padding:4px}
.tlist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;font-size:14px}
.tlist small{display:block;font:11.5px var(--mono);opacity:.75;overflow-wrap:anywhere}
.tlist button:hover{background:var(--accent-soft)}.tlist button[aria-current="true"]{background:var(--accent);color:var(--bg)}
@media (max-width:600px){.tabs{flex-wrap:wrap;overflow-x:visible}.top{position:static}}
@media (max-width:820px){.cols,.split{grid-template-columns:minmax(0,1fr)}nav.rail{position:static;flex-direction:row;overflow-x:auto;padding:4px}nav.rail button{grid-template-columns:auto auto auto;white-space:nowrap;border:1px solid var(--line)}
 details:is(.item,.run)>summary{grid-template-columns:auto minmax(0,1fr)}details:is(.item,.run)>summary .tags{grid-column:1/-1;justify-content:flex-start}dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dt{margin-top:6px}.tlist{max-height:220px}}
</style>
</head>
<body>
<a class="skip" id="skip" href="#app">Skip to content</a>
<header class="top">
  <div class="row"><span class="brand" id="brand">Review ledger</span><button class="theme" id="theme" type="button">Theme: Automatic</button></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="app"></main>
<div class="visually-hidden" id="live" role="status"></div>
<script>
"use strict";
// The viewer page. `ledger.py serve` sends it as it is; `ledger.py progress-page` sends the same page with the
// ledger's answers embedded before this script (window.LEDGER_SNAPSHOT: see STATIC). The viewer's key arrives in
// the launch address (#k=...) and goes back with every request as X-Ledger-Token; the page holds no secret.
//
// Addresses (the part after #), the view that draws each, and what it asks the server (/api/...):
//   #/                                   home      overview (every page), home, then checks
//   #/guide                              guide     plans, reviews, guide
//   #/inbox, #/inbox/GATE-0001           inbox     gates?status=pending, decisions
//   #/decisions, #/decisions/D-0001      decisions decisions
//   #/history, #/history/GATE-0001       history   gates?status=all, a page at a time
//   #/reviews                            reviews   reviews
//   #/review/R-0001?match=none           review    review/<code>; finding/<id> as a point opens; run/<id>
//   #/goals, #/goals/G-01                goals     goals
//   #/ideas, #/ideas/FP-0001             ideas     ideas
//   #/issues?status=&severity=&domain_code=&q=&offset=   issues   issues?...
//   #/issue/ISS-0001                     issue     issue/<code>
//   #/plans                              plans     plans
//   #/plan/P-0001, #/plan/P-0001/phase/2 plan      plan/<code>?phase=N; step/<code>/<n> as a step opens
//   #/trends                             trends    trends
//   #/explore, #/explore/<table>?offset= explore   tables, table/<name>, sql
// Any view: source/<id> when a code reference is opened. An unknown address draws the home page.
// The token arrives once, in the launch URL's fragment (#k=<token>, optionally followed by #/route); it is kept in
// sessionStorage for this tab and removed from the address bar. The page itself carries no secret.
let TOKEN = "";
function takeToken(){
  const m = /^#k=([A-Za-z0-9_-]+)(#.*)?$/.exec(location.hash);
  if (m) {
    TOKEN = m[1];
    try { sessionStorage.setItem("ledger-token", TOKEN); } catch {}
    try { history.replaceState(null, "", location.pathname.replace(/^\/+/, "/") + location.search + (m[2] || "#/")); } catch {}
  } else if (!TOKEN) {
    try { TOKEN = sessionStorage.getItem("ledger-token") || ""; } catch {}
  }
}
takeToken();
let LABELS = {domains:{}, themes:{}}, OVERVIEW = null;

// ---------- the shared copy
// `ledger.py progress-page` writes this page as one file with every API answer embedded (window.LEDGER_SNAPSHOT).
// STATIC is that data; in the viewer it is null. With it the page answers api() from the data, routes on hash names
// a published page allows (#issue-ISS-0019), shows the How it works tab, and keeps the owner's gate answers for
// `ledger.py import-answers` (see ANSWER_STORES).
const STATIC = (s => s && typeof s === "object" && s.responses ? s : null)(window.LEDGER_SNAPSHOT);
let CUR_PATH = null;
const ACTIVE = STATIC ? STATIC.active : [];
const slugOf = p => (p || "").split("?")[0].replace(/^#\/?/, "").replace(/[\/_]/g, "-").replace(/[^A-Za-z0-9-]/g, "") || "home";
function pathFromSlug(s){
  s = (s || "").replace(/^#/, "");
  if (!s || s === "home") return STATIC && STATIC.start && CUR_PATH === null ? STATIC.start : "";
  const m = s.match(/^([a-z]+)(?:-(.*))?$/); if (!m) return "";
  const [, view, rest] = m;
  if (!rest) return view;
  if (view === "plan") { const p = rest.match(/^(P-\d+)(?:-phase-(\d+))?$/); return p ? `plan/${p[1]}` + (p[2] ? `/phase/${p[2]}` : "") : "plans"; }
  if (view === "explore") { const t = (STATIC.responses.tables || []).find(t => t.name.replace(/_/g, "-") === rest); return t ? `explore/${t.name}` : "explore"; }
  return `${view}/${rest}`;
}
function nav(hash){ CUR_PATH = hash.replace(/^#\/?/, ""); const s = slugOf(CUR_PATH); if (location.hash.slice(1) === s) route(); else location.hash = s; }
function setPath(hash){ if (!STATIC) { history.replaceState(null, "", hash); return; } CUR_PATH = hash.replace(/^#\/?/, ""); try { history.replaceState(null, "", "#" + slugOf(CUR_PATH)); } catch {} }
function currentPath(){
  if (!STATIC) return location.hash.replace(/^#\/?/, "");
  const s = location.hash.slice(1);
  if (CUR_PATH === null || slugOf(CUR_PATH) !== (s || "home")) CUR_PATH = pathFromSlug(s);
  return CUR_PATH;
}
function staticApi(path, body){
  if (body !== undefined) return Promise.reject(new Error("This shared copy is read-only. Answer in the chat with the agent, or run the local viewer."));
  const S = STATIC.responses, [p, q] = path.split("?"), qs = new URLSearchParams(q || "");
  const copy = v => JSON.parse(JSON.stringify(v));
  // A paged list: the snapshot holds every row, and the page asked for is cut from the rows that match.
  const paged = (all, key, extra) => {
    const lim = Math.max(1, Math.min(500, Number(qs.get("limit")) || 200)), off = Math.max(0, Number(qs.get("offset")) || 0);
    return Promise.resolve(copy({...extra, [key]: all.slice(off, off + lim), total: all.length, limit: lim, offset: off}));
  };
  if (p === "issues") {
    const st = qs.get("status"), sv = qs.get("severity"), dm = qs.get("domain_code"), t = (qs.get("q") || "").toLowerCase();
    return paged(S.issues.rows.filter(i => (!st || (st === "active" ? ACTIVE.includes(i.status) : i.status === st))
      && (!sv || i.severity === sv) && (!dm || i.domain_code === dm) && (!t || i.search.toLowerCase().includes(t))), "rows");
  }
  if (p === "gates") {
    const st = qs.get("status") || "pending";
    if (st === "pending") return Promise.resolve(copy(S["gates?status=pending"]));
    const all = S["gates?status=all"].gates.filter(g => st === "all" || g.status === st), at = all.findIndex(g => g.code === qs.get("at"));
    if (at > 0) qs.set("offset", at - at % 200);
    return paged(all, "gates");
  }
  if (/^review\/[^/]+\/(checks|relations)$/.test(p) && S[p]) return paged(S[p].rows, "rows");
  if (p.startsWith("review/") && qs.get("q") && S[p]) {   // the search of a review's points, over each point in full
    const t = qs.get("q").toLowerCase();
    return Promise.resolve({match: S[p].findings.filter(f => JSON.stringify(S["finding/" + f.id] || f).toLowerCase().includes(t)).map(f => f.id)});
  }
  if (p.startsWith("table/")) {
    const t = S[p]; if (!t) return Promise.reject(new Error("This copy does not hold that table."));
    const off = Number(qs.get("offset")) || 0, lim = Number(qs.get("limit")) || 100;
    return Promise.resolve({columns: t.columns, rows: copy(t.rows.slice(off, off + lim)), count: t.count, total: t.total, more: off + lim < t.count, offset: off, limit: lim});
  }
  if (S[p] === undefined) return Promise.reject(new Error("This copy does not hold that page."));
  return Promise.resolve(copy(S[p]));
}

// Where the shared copy keeps the owner's answers. Each entry of ANSWER_STORES is one optional store, offered by the
// place the page is published; it returns {watch(onChange), save(code, answer)} or null. When none is there the
// answers stay in this browser (localStore) and download as answers.json. Either way the agent records them with
// `ledger.py import-answers`, which reads both shapes.
const ANSWER_STORES = [
  async () => {   // an artifact page with a database: collection "answers", one document per gate code
    const host = window.claude; if (!host || typeof host.use !== "function") return null;
    const db = await host.use("db"); if (!db) return null;
    return {watch: (ok, bad) => db.collection("answers").onSnapshot(snap => ok(Object.fromEntries(snap.docs.map(d => [d.id, d.data()]))), bad),
            save: (code, a) => db.doc("answers/" + code).set(a)};
  },
];
const LOCAL_ANSWERS = () => "ledger-answers:" + ((STATIC && STATIC.responses.overview && STATIC.responses.overview.project) || "");
const localStore = {local: true, kept: {},
  read(){ try { return JSON.parse(localStorage.getItem(LOCAL_ANSWERS()) || "{}") || {}; } catch { return this.kept; } },
  watch(ok){ ok(this.read()); },
  async save(code, a){ const all = {...this.read(), [code]: a}; this.kept = all; try { localStorage.setItem(LOCAL_ANSWERS(), JSON.stringify(all)); } catch {} }};
const HUB = {store: null, answers: {}, error: null};
const OPEN_GATES = () => STATIC ? (STATIC.responses["gates?status=pending"].gates || []).filter(g => g.status === "open").map(g => g.code) : [];
const hubAnsweredOpen = () => OPEN_GATES().filter(c => HUB.answers[c]).length;
async function hubInit(){
  if (!STATIC) return;
  let store = null;
  for (const make of ANSWER_STORES) { try { store = await make(); } catch (e) { HUB.error = String(e); } if (store) break; }
  HUB.store = store || localStore;
  try {
    HUB.store.watch(got => {
      HUB.answers = got || {};
      const cur = document.querySelector('#tabs a[aria-current="page"]');
      if (OVERVIEW) drawTabs(cur ? (cur.dataset.k || "") : "");
    }, e => { HUB.error = e && e.code; });
  } catch (e) { HUB.error = String(e); }
}
// The answers kept in this browser as a file for the agent (import-answers takes this list as it is).
function answersFile(){
  const list = Object.entries(HUB.answers).map(([gate, a]) => ({gate, answer_value: a.answer_value ?? null, answer_text: a.answer_text ?? null, answered_at: a.answered_at || null}));
  const href = URL.createObjectURL(new Blob([JSON.stringify(list, null, 1)], {type: "application/json"}));
  return h("a", {href, download: "answers.json"}, "Download your answers");
}
const HANDOVER = () => HUB.store && HUB.store.local
  ? [" ", answersFile(), " and give the file to the agent, or tell it your answer in the chat."]
  : [" The agent records it the next time it checks (or tell it in the chat to check now)."];
function md(text){
  const lines = String(text || "").split("\n"), out = []; let i = 0;
  const inline = str => { const parts = []; const re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g; let last = 0, m;
    while ((m = re.exec(str))) { if (m.index > last) parts.push(str.slice(last, m.index)); const t = m[0];

const FINAL = "You can't change an answer once it is sent.";
const IN_CHAT = "Answer this one in the chat with the agent.";
// What an open gate is answered with: its options as one radio group (checkboxes, the recommended ones ticked, with
// Select all and Select none, when it takes several) and, where the gate takes text, a text box. hid: the id of the
// gate's title, which names them for a screen reader. picked() is the answer the choices give: a value, a list of
// values for a multi-select gate, or null.
function gateInputs(g, hid){
  const name = "opt-" + g.code, multi = !!g.multi, pre = new Set(g.preselect || []);
  const option = o => h("label", null, h("input", multi ? {type:"checkbox", name, value:o.value, checked: pre.has(o.value) ? "" : null} : {type:"radio", name, value:o.value}),
    h("span", null, o.label, o.description ? h("small", null, o.description) : null));
  let opts = (g.options || []).length ? h("div", {class:"opts", role: multi ? "group" : "radiogroup", "aria-labelledby":hid}, g.options.map(option)) : null;
  if (opts && multi) {
    const all = on => () => opts.querySelectorAll("input").forEach(i => { i.checked = on; });
    opts = h("div", null, h("div", {class:"tools"}, h("button", {type:"button", class:"btn ghost", onclick: all(true)}, "Select all"),
      h("button", {type:"button", class:"btn ghost", onclick: all(false)}, "Select none")), opts);
  }
  const ta = g.allow_text ? h("textarea", {class:"field", placeholder: opts ? "Add a note or a different answer (optional)" : "Your answer",
    id:hid + "-text", "aria-label":"Your answer", "aria-labelledby":`${hid}-text ${hid}`}) : null;
  const picked = () => { const on = [...(opts ? opts.querySelectorAll(`input[name="${name}"]:checked`) : [])].map(i => i.value);
    return multi ? on : (on[0] || null); };

function gateCard(g, level, moved){
  const hid = "gate-" + g.code;   // the title's id: it names this gate's choices, text box and button
  const refs = [g.review_code && h("a", {href:"#/review/" + g.review_code}, "Review " + g.review_code),
                g.plan_code && h("a", {href:"#/plan/" + g.plan_code}, "Plan " + g.plan_code + (g.step_number ? " step " + g.step_number : "")),
                g.issue_code && h("a", {href:"#/issue/" + g.issue_code}, "Issue " + g.issue_code),
                g.decision_code && h("a", {href:"#/decisions/" + g.decision_code}, "Decision " + g.decision_code)].filter(Boolean);
  const card = h("div", {class:"card gate"},
    h("div", null, tag(lab("gate", g.kind), tone("gate", g.kind) || tone("gstat", g.status) || "info"),
      g.blocking && g.status === "open" ? tag("Work is paused until you answer", "warn") : null,
      h("span", {class:"note"}, " Asked " + when(g.created_at))),
    h(level || "h2", {id:hid, class: level ? "title" : null}, g.title), g.question ? h("div", {class:"q"}, g.question) : null,
    g.context ? h("div", {class:"ctx"}, g.context) : null,
    refs.length ? h("div", {class:"refline"}, refs) : null);
  if (g.status !== "open") {
    add(card, h("p", {class:"callout answer"}, g.answer_value != null || g.answer_text ? ["You answered: ", answerText(g, true), g.answered_at ? ` (${when(g.answered_at)})` : ""] : lab("gstat", g.status)));
    return card;
  }
  if (!(g.options || []).length && !g.allow_text) { add(card, h("p", {class:"note"}, IN_CHAT)); return card; }
  if (STATIC) return hubGateBody(card, g, hid);
  const {opts, ta, picked} = gateInputs(g, hid);
  const msg = h("div");
  const send = h("button", {class:"btn", type:"button", id:hid + "-send", "aria-labelledby":`${hid}-send ${hid}`, onclick:async () => {
    send.disabled = true;
    try {
      await api(`gates/${encodeURIComponent(g.code)}/answer`, {answer_value: picked(), answer_text: ta ? ta.value : null});
      say("Answer saved.");
      if (moved) await moved(card, g, "Answer saved. The agent will act on it the next time it checks."); else put(msg, h("p", {class:"status"}, "Answer saved."));
    } catch (e) {
      // 409: answered meanwhile, in another tab or in the chat. Anything else (a busy ledger, a refused answer):
      // the choice and the text stay as typed and Send works again.
      if (e.status === 409 && moved) { say(e.message); await moved(card, g, "Already answered in another tab or in the chat; this is the answer on record."); return; }
      put(msg, errorBox(e)); send.disabled = false;
    }
  }}, "Send answer");
  add(card, opts, ta, h("div", {class:"tools"}, send, h("span", {class:"note"}, FINAL)), msg);
  return card;
}

  // once, and asks the server for points whose detail or cited files contain the text.

    const t = q.value.trim().toLowerCase();

      && (!t || `${f.point_id} ${f.summary} ${f.issue_code || ""}`.toLowerCase().includes(t) || (deep && deep.has(f.id)))) hit.push(i); });

  return [...groups].sort((a, b) => (a[0] === "" ? -1 : b[0] === "" ? 1 : domainName(a[0]).localeCompare(domainName(b[0]))));

// The filters live in the address (#/issues?status=all&severity=H&domain_code=spec&q=text&offset=200), so a reload, a
// link and the back button all give the same list. No status in the address means the issues still to fix.
VIEWS.issues = async (_, params) => {
  const o = OVERVIEW;
  const q = h("input", {class:"field", type:"search", placeholder:"Search titles, ids, point ids", "aria-label":"Search issues", value:params.get("q") || ""});
  const st = select("Status", [["active","Still to fix"],["","Any status"], ...Object.entries(L.issue)]);
  const sv = select("Severity", [["","Any severity"], ...Object.entries(L.sev)]);
  const dm = select("Area", [["","All areas"], ...Object.entries(o.labels.domains)]);
  const has = (sel, v) => [...sel.options].some(x => x.value === v);
  const status = params.get("status"), area = params.get("domain_code") || params.get("domain") || "";
  st.value = status == null ? "active" : has(st, status) ? status : "";
  sv.value = has(sv, params.get("severity") || "") ? params.get("severity") || "" : "";
  dm.value = has(dm, area) ? area : "";
  const box = h("div", {class:"stack"});
  let asked = 0, offset = Math.max(0, Number(params.get("offset")) || 0);
  const load = async (changed, turned) => {
    if (changed && !turned) offset = 0;
    const p = new URLSearchParams(), text = q.value.trim();
    if (st.value) p.set("status", st.value); if (sv.value) p.set("severity", sv.value); if (dm.value) p.set("domain_code", dm.value); if (text) p.set("q", text);
    const shown = new URLSearchParams(p); if (!st.value) shown.set("status", "all"); else if (st.value === "active") shown.delete("status");
    if (offset) shown.set("offset", offset);
    if (changed) setPath("#/issues" + (String(shown) ? "?" + shown : ""));
    p.set("limit", PAGE_ROWS); p.set("offset", offset);
    const mine = ++asked;   // an answer that arrives after a newer question was asked is dropped
    try {
      const d = await api("issues?" + p);
      if (mine !== asked) return;
      const count = plural(d.total, "issue");
      if (changed) say(count);
      put(box, h("p", {class:"note"}, count), table([{label:"Issue", key:"code"}, {label:"Title", key:"title"}, {label:"Severity", get:i => sevTag(i.severity)},
        {label:"Status", get:i => issueTag(i.status)}, {label:"Area", get:i => domainName(i.domain_code)}, {label:"First seen", key:"first_seen"}, {label:"Last seen", key:"last_seen"}, {label:"Reviews", key:"times_seen", num:1}],
        d.rows, i => "#/issue/" + i.code, d.total ? "No more issues." : "No issue matches these filters."),
        pager(d, d.rows.length, off => { offset = off; load(true, true).then(() => { window.scrollTo(0, 0); focusHeading(); }); }));
    } catch (e) { if (mine === asked) put(box, errorBox(e)); }
  };
  setView(h("h1", null, "Issues"), h("p", {class:"lede"}, "One issue per underlying problem, followed across reviews."), filterBar([q, st, sv, dm], load, 250), box);
  load();
};

// The plan arrives with every step's row and search text, and with the text and notes of one phase's steps. A step

VIEWS.plan = async ([code, , phaseArg]) => {
  const d = await api("plan/" + encodeURIComponent(code) + (Number(phaseArg) ? "?phase=" + Number(phaseArg) : ""));
  const steps = d.steps, phases = d.phase_rows, prog = Object.fromEntries(d.phases.map(p => [p.phase, p]));
  let phase = Number(phaseArg) || (phases[0] && phases[0].number) || 1;

  const q = h("input", {class:"field", type:"search", placeholder:"Search steps, or a point id", "aria-label":"Search steps or point ids"});
  // The filter's choices: every step status and every owner need, worded by the ledger's labels.
  const needs = Object.entries(L.need).filter(([v, t]) => v !== "none" && t);
  const f = select("Filter steps", [["", "All steps"], ...Object.entries(L.step).map(([v, t]) => ["st-" + v, t]),
    ["any", "Needs you"], ...needs.map(([v, t]) => [v, "Needs " + t[0].toLowerCase() + t.slice(1)]),
    ["behavior", "Changes behaviour"]]);
  const nav = h("nav", {class:"rail", "aria-label":"Phases"}), main = h("div", {class:"stack steps"});
  const match = s => {
    const t = q.value.trim().toLowerCase(), v = f.value;
    if (v.startsWith("st-") && s.status !== v.slice(3)) return false;
    if (v === "any" && s.owner_need === "none") return false;
    if (needs.some(n => n[0] === v) && s.owner_need !== v) return false;
    if (v === "behavior" && !s.behavior_change) return false;
    return !t || s.search.includes(t);
  };
  const commitLine = c => h("div", null, h("code", null, short(c.commit_sha)), c.branch ? ` on ${c.branch}` : "",
    c.summary ? " " + c.summary : "", c.pr_url ? [" ", extLink(c.pr_url, "pull request")] : "");
  const closeLine = c => h("div", {class:"refline"}, h("code", null, `${c.review} · ${c.point_id}`), sevTag(c.severity),
    c.issue ? h("a", {href:"#/issue/" + c.issue}, c.issue) : null, h("span", null, c.summary));
  const stepBody = (s, closes) => [
    kv([["Change", s.change], ["Proof", s.proof],
      ["Depends on", s.depends.length ? `${noun(s.depends.length, "Step")} ${s.depends.join(", ")}` : null],
      ["Behaviour change", s.behavior_note],
      ["Needs from you", s.owner_question], ["Progress", s.progress_note], ["Started", whenCell(s.started_at)], ["Done", whenCell(s.done_at)],
      ["Closes no point because", s.no_findings_reason],

    closes.length ? h("div", {class:"ref"}, h("span", {class:"note"}, "Closes " + plural(closes.length, "point")), closes.map(closeLine)) : null];

     s.owner_need !== "none" ? tag(lab("need", s.owner_need), tone("need", s.owner_need) || "info") : null,

    async () => {

      if (s.change !== undefined && !s.closes.length) return stepBody(s, []);

  // The phase buttons are built once and marked in place, so the one just pressed keeps the keyboard focus.
  const rail = phases.map(p => { const pr = prog[p.number] || {}; return h("button", {type:"button",
    onclick:() => { phase = p.number; q.value = ""; f.value = ""; shown = PLAN_PAGE; setPath(`#/plan/${code}/phase/${phase}`); draw(); }},
    h("span", {class:"i"}, p.number), h("span", null, p.title, p.first_step ? h("small", null, p.first_step === p.last_step ? `step ${p.first_step}` : `steps ${p.first_step}–${p.last_step}`) : null),

        sections.map(sec => [sec ? h("h3", null, sec) : null, ps.filter(s => (s.section || "") === sec).map(stepItem)]));
    }
  };
  const filters = filterBar([q, f], () => { shown = PLAN_PAGE; say(draw()); }, 150);
  const pl = d.plan, closed = new Set(steps.flatMap(s => s.closes)).size;
  const head =[h("h1", null, `${pl.code} · ${pl.title}`),
    h("p", {class:"lede"}, lab("plan", pl.status) + (pl.approved_at ? ` · approved ${when(pl.approved_at)}` : "") + (d.last_updated ? ` · last updated ${when(d.last_updated)}` : "")),

    pl.narrative_md ? h("div", {class:"card"}, h("h2", null, "About this plan"), md(pl.narrative_md)) : null,
    d.gates.length ? h("div", {class:"card"}, h("h2", null, "Questions about this plan"),

    d.discoveries.length ? h("details", {class:"card"}, h("summary", null, plural(d.discoveries.length, "defect") + " found during fixes"),
      table([{label:"Point", get:x => `${x.review} · ${x.point_id}`}, {label:"Severity", get:x => sevTag(x.severity)}, {label:"What", key:"summary"}, {label:"Found in step", key:"found_in_step", num:1},
             {label:"Issue", get:x => x.issue ? h("a", {href:"#/issue/" + x.issue}, x.issue) : "Not matched yet"}, {label:"Closed by step", get:x => x.closing_step ?? "Not planned yet", num:1}], d.discoveries)) : null,
    d.artifacts.length ? h("details", {class:"card"}, h("summary", null, "Files and documents"), filesTable(d.artifacts)) : null];
  if (d.unguarded.length) head.push(h("details", {class:"card"}, h("summary", null, plural(d.unguarded.length, "fixed issue has", "fixed issues have") + " no test guarding the fix"),
    table([{label:"Issue", key:"code"}, {label:"Title", key:"title"}, {label:"Step", key:"step", num:1}, {label:"Guard test", get:u => u.problem === "no guard test" ? "None" : "Removed"}], d.unguarded, u => "#/issue/" + u.code)));

  if (!phases.length) return setView(head, empty("This plan has no phases yet."), add(main, steps.map(stepItem)), past);

// A line of values over reviews. The drawing is as wide as its box (one unit is one pixel, so the 11 px labels stay
// readable on a phone); labels that would run into each other are left out, the latest always shown. The same
// values are in a table for screen readers.
function lineChart(points, unit){
  const H = 160, P = 30;
  if (!points.length) return empty("No values.");
  const vs = points.map(p => p.value), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1, last = points.length - 1;
  const value = p => `${+p.value.toFixed(2)}${unit ? " " + unit : ""}`;
  const ns = "http://www.w3.org/2000/svg", el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = el("svg", {role:"img", "aria-label":"Values over reviews"});
  let width = 0;
  const draw = W => {
    width = W;
    const x = i => P + (points.length === 1 ? (W - 2*P) / 2 : i * (W - 2*P) / last), y = v => H - P - (v - lo) * (H - 2*P) / span;
    const every = Math.max(1, Math.ceil(points.length * 56 / (W - 2*P)));   // a label needs about 56 px
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.replaceChildren(el("line", {x1:P, x2:W-P, y1:H-P, y2:H-P, stroke:"var(--line)"}),
      el("polyline", {points:points.map((p,i) => `${x(i)},${y(p.value)}`).join(" "), fill:"none", stroke:"var(--accent)", "stroke-width":2}));
    points.forEach((p,i) => {
      svg.append(el("circle", {cx:x(i), cy:y(p.value), r:3.5, fill:"var(--accent)"}));
      if ((last - i) % every) return;
      const t1 = el("text", {x:x(i), y:y(p.value) - 8, "text-anchor":"middle", "font-size":11, fill:"var(--fg)"}); t1.textContent = value(p); svg.append(t1);
      const t2 = el("text", {x:x(i), y:H - 10, "text-anchor":"middle", "font-size":11, fill:"var(--muted)"}); t2.textContent = p.review; svg.append(t2);
    });
  };
  draw(520);
  const box = h("div", {class:"chart"}, svg, h("table", {class:"visually-hidden"},
    h("thead", null, h("tr", null, h("th", null, "Review"), h("th", null, "Value"))),
    h("tbody", null, points.map(p => h("tr", null, h("td", null, p.review), h("td", null, value(p)))))));
  // Rounded down: a drawing a fraction wider than its box would be scaled down, its labels with it.
  new ResizeObserver(() => { const w = Math.max(200, Math.floor(box.getBoundingClientRect().width)); if (box.clientWidth && w !== width) draw(w); }).observe(box);
  return box;
}

const cellText = v => v && typeof v === "object" && "blob_bytes" in v ? `<${v.blob_bytes} bytes>` : String(v);
// #/explore/<table or view>?offset=N. Tables show their row count; a view is counted only when asked, since counting
// one runs its whole query.
VIEWS.explore = async ([name], params) => {
  const tables = await api("tables");
  const list = h("div", {class:"tlist"}), right = h("div", {class:"stack loose"});
  const cell = v => h("td", {class: typeof v === "number" ? "num mono" : null, title: v == null ? null : cellText(v).slice(0, 2000)},
    v == null ? h("span", {class:"muted"}, "—") : cellText(v));
  const grid = (cols, data) => data.length ? h("div", {class:"scroll card grid"}, h("table", null,
    h("thead", null, h("tr", null, cols.map(c => h("th", null, c)))),
    h("tbody", null, data.map(r => h("tr", null, r.map(cell)))))) : empty("No rows.");
  const showTable = async (t, offset=0, paged=false) => {
    const info = tables.find(x => x.name === t) || {label:t, description:""};
    list.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.n === t)));
    setPath("#/explore/" + t + (offset ? "?offset=" + offset : ""));
    try {
      const d = await api(`table/${encodeURIComponent(t)}?limit=${EXPLORE_ROWS}&offset=${offset}`);
      const range = d.rows.length ? `rows ${offset + 1}–${offset + d.rows.length}` : "no rows here";
      const counted = h("span", null, d.count != null ? `${plural(d.count, "row")}` + (d.count > d.rows.length ? ` · ${range}` : "") : range);
      const count = d.count == null && !STATIC ? h("button", {class:"btn ghost", type:"button", onclick:async e => {
        try { const c = await api(`table/${encodeURIComponent(t)}?limit=1&count=1`); counted.textContent = `${plural(c.count, "row")} · ${range}`; e.target.remove(); say(counted.textContent); }
        catch (err) { put(counted, errorBox(err)); } }}, "Count the rows") : null;
      put(right, h("h2", null, info.label), info.description ? h("p", {class:"lede"}, info.description) : null,
        h("p", {class:"note"}, "Stored as ", h("code", null, t), info.for_agent ? ". The agent reads this view; no page of this site shows it." : "",
          STATIC && d.total > d.count ? ` · this copy holds the first ${d.count} of ${plural(d.total, "row")}` : ""),
        h("p", {class:"note"}, counted, d.truncated ? " · some rows are too large to show here" : ""),
        h("div", {class:"tools"}, offset > 0 ? h("button", {class:"btn ghost", type:"button", onclick:() => showTable(t, Math.max(0, offset - EXPLORE_ROWS), true)}, "Previous") : null,
          d.more ? h("button", {class:"btn ghost", type:"button", onclick:() => showTable(t, offset + EXPLORE_ROWS, true)}, "Next") : null, count,
          STATIC ? null : h("button", {class:"btn ghost", type:"button", onclick:() => { sql.value = `SELECT * FROM ${t} LIMIT 50`; sql.focus(); }}, "Query this")),
        grid(d.columns, d.rows));
      if (paged) (right.querySelector("button") || right).focus();   // the pressed button was redrawn: Previous, or Next on the first page
    } catch (e) { put(right, errorBox(e)); }
  };
  const sec = (title, type) => [sect(title), tables.filter(t => t.type === type).map(t => h("button", {type:"button", "data-n":t.name, title:t.description || null, onclick:() => showTable(t.name)},
    h("span", null, t.label, h("small", null, t.name)), t.count != null ? h("span", {class:"muted"}, t.count) : null))];
  add(list, sec("Saved views", "view"), sec("Tables", "table"));
  const sql = h("textarea", {class:"field mono", "aria-label":"SQL query", placeholder:"SELECT code, title, status FROM issues WHERE severity = 'H'"});
  const out = h("div");
  const run = async () => {
    try {
      const d = await api("sql", {sql: sql.value});
      const count = plural(d.rows.length, "row") + (d.truncated ? ` (first ${d.rows.length.toLocaleString("en")} shown)` : "");
      put(out, h("p", {class:"note"}, count), grid(d.columns, d.rows));
    } catch (e) { put(out, errorBox(e)); }
  };
  sql.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
  setView(h("h1", null, "Explore the ledger"),
    h("p", {class:"lede"}, STATIC ? "Every table and saved view, as stored when this copy was made."
      : "Every table and saved view, as stored. Queries only read."),
    STATIC ? h("p", {class:"note"}, "To run queries, start the local viewer (python3 ledger.py serve). This copy holds up to 500 rows of each table and view, with long values cut.")
    : h("div", {class:"card stack"}, h("b", null, "Query"), sql, h("div", {class:"tools"}, h("button", {class:"btn", type:"button", onclick:run}, "Run query"), h("span", {class:"note"}, "Ctrl or ⌘ + Enter runs it")), out),
    h("div", {class:"split"}, list, right));
  if (name && tables.some(t => t.name === name)) showTable(name, Math.max(0, Number(params.get("offset")) || 0)); else add(right, empty("Choose a table or view on the left."));
};

// ---------- routing
// The tabs: [key, address, name]. drawTabs(active) draws them with the Waiting on you badge.
const TABS = [["home","#/","Overview"], ["guide","#/guide","How it works"], ["inbox","#/inbox","Waiting on you"],
  ["reviews","#/reviews","Reviews"], ["goals","#/goals","Design goals"], ["ideas","#/ideas","Ideas"], ["issues","#/issues","Issues"],
  ["plans","#/plans","Fix plans"], ["trends","#/trends","Over time"], ["explore","#/explore","Explore"]];
// What the badge counts: everything in the owner's queue still to act on. In the shared copy, less the open gates
// answered there since the copy was made.
const waitingCount = () => Math.max(0, (OVERVIEW ? OVERVIEW.queue_count : 0) - (STATIC ? hubAnsweredOpen() : 0));
let TAB = "home";
function drawTabs(active){
  TAB = active;
  const n = waitingCount();
  put(document.getElementById("tabs"), ...TABS.map(([k, href, t]) => {
    const badge = k === "inbox" && n > 0;
    return h("a", {href, "data-k": k, "aria-current": active === k ? "page" : null, "aria-label": badge ? `${t}, ${n} waiting` : null}, t, badge ? h("span", {class:"badge"}, n) : null); }));
  // Where the tabs scroll sideways, bring the current one into view (not scrollIntoView: Chrome then starts Tab from it).
  const tabs = document.getElementById("tabs"), cur = tabs.querySelector('a[aria-current="page"]');
  if (cur && tabs.scrollWidth > tabs.clientWidth) tabs.scrollLeft = cur.offsetLeft - tabs.offsetLeft - (tabs.clientWidth - cur.offsetWidth) / 2;
}
function takeOverview(o){
  OVERVIEW = o; LABELS = o.labels; setLabels(LABELS.enums);
  put(document.getElementById("brand"), o.project, h("small", null, STATIC ? "review ledger · updated " + when(STATIC.taken) : "review ledger"));
  document.title = o.project + " · review ledger";
}
// Keeps the badge current without a navigation: when the window is looked at again, every 30 s while it is
// visible, and after an answer (now). A changed count also brings new questions into an open inbox.
let REFRESHED = 0;
async function refreshHeader(now){
  if (STATIC || document.hidden || (now !== true && Date.now() - REFRESHED < 2000)) return;
  REFRESHED = Date.now();
  try {
    const was = OVERVIEW, o = await api("overview");
    takeOverview(o); drawTabs(TAB);
    if (INBOX && was && (was.queue_count !== o.queue_count || was.answered_count !== o.answered_count)) await INBOX.sync();
  } catch {}   // the next navigation says what is wrong
}
// Draw the view the address names: one overview request (the header, the labels, the badge), then the view.
// OVERVIEW is refreshed again only by refreshHeader().
async function route(){
  takeToken();
  const raw = currentPath();
  const [pathPart, query] = raw.split("?");
  const parts = pathPart.split("/").filter(Boolean).map(decodeURIComponent);
  const name = parts[0] || "home";
  const view = VIEWS[name] || VIEWS.home;
  const tab = {review:"reviews", issue:"issues", plan:"plans", history:"inbox", decisions:"inbox"}[name] || (VIEWS[name] ? name : "home");
  INBOX = null;
  try {
    takeOverview(await api("overview")); REFRESHED = Date.now();   // the one overview request of a navigation
    drawTabs(tab);
    await view(parts.slice(1), new URLSearchParams(query || ""));
  } catch (e) { drawTabs(tab); failed(e, name, parts.slice(1)); }
}
window.addEventListener("focus", () => refreshHeader());
document.addEventListener("visibilitychange", () => refreshHeader());
setInterval(() => refreshHeader(), 30000);
window.addEventListener("hashchange", route);
document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); focusHeading(); });
// --top: the sticky header's height, which scrolling to a focused control and the plan's phase list stay clear of.
(() => {
  const top = document.querySelector("header.top");
  const set = () => document.documentElement.style.setProperty("--top", (getComputedStyle(top).position === "sticky" ? top.offsetHeight : 0) + 8 + "px");
  new ResizeObserver(set).observe(top); set();
})();

// ---------- theme
// The Theme button: Automatic (the system setting), Light or Dark, kept in localStorage under "ledger-theme".
(() => {
  const btn = document.getElementById("theme"), order = ["auto","light","dark"], dark = matchMedia("(prefers-color-scheme:dark)");
  const name = {auto:"Automatic", light:"Light", dark:"Dark"}, next = () => order[(order.indexOf(t) + 1) % 3];
  let t = "auto"; try { t = localStorage.getItem("ledger-theme") || "auto"; } catch {}
  if (!order.includes(t)) t = "auto";
  // data-theme is always the palette in use; "auto" follows the system setting, also when it changes.
  const apply = () => { document.documentElement.setAttribute("data-theme", t === "auto" ? (dark.matches ? "dark" : "light") : t);
    btn.textContent = "Theme: " + name[t]; btn.setAttribute("aria-label", `Theme: ${name[t]}. Switch to ${name[next()]}.`); };
  dark.addEventListener("change", apply);
  btn.addEventListener("click", () => { t = next(); try { localStorage.setItem("ledger-theme", t); } catch {} apply(); });
  apply();
})();
route();
hubInit();
